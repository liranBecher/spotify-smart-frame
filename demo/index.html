<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spotify Smart Frame Mockup</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #fff;
      background: #090909;
      font-family: Inter, system-ui, sans-serif;
    }
    .frame {
      width: min(100%, 900px);
      aspect-ratio: 16 / 9;
      display: grid;
      grid-template-columns: minmax(0, 35fr) minmax(0, 65fr);
      gap: clamp(20px, 4vw, 54px);
      padding: clamp(24px, 5vw, 64px);
      overflow: hidden;
      border: 1px solid #2c2c2c;
      border-radius: 24px;
      background:
        radial-gradient(circle at 12% 15%, #774c9c55, transparent 42%),
        linear-gradient(145deg, #19151d, #0b0b0b 72%);
      box-shadow: 0 28px 80px #000a;
    }
    .cover {
      width: 100%;
      aspect-ratio: 1;
      align-self: center;
      border-radius: 12px;
      background:
        radial-gradient(circle at 62% 36%, #ffcfaa 0 8%, transparent 9%),
        radial-gradient(circle at 60% 48%, #d87e75 0 20%, transparent 21%),
        linear-gradient(135deg, #f7c58d, #86508a 48%, #272440);
      background-position: center;
      background-size: cover;
      box-shadow: 0 20px 50px #0009;
    }
    .content {
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .eyebrow {
      margin: 0 0 12px;
      color: #1ed760;
      font-size: clamp(10px, 1.4vw, 13px);
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      overflow: hidden;
      font-size: clamp(28px, 5vw, 58px);
      line-height: .98;
      letter-spacing: -.04em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .artist {
      margin: 12px 0 0;
      color: #b9b9b9;
      font-size: clamp(15px, 2.2vw, 22px);
    }
    .progress {
      height: 5px;
      margin-top: clamp(22px, 4vw, 42px);
      overflow: hidden;
      border-radius: 999px;
      background: #ffffff30;
    }
    .progress span {
      display: block;
      width: 42%;
      height: 100%;
      border-radius: inherit;
      background: #fff;
    }
    .times {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      color: #858585;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }
    .lyrics {
      margin-top: clamp(20px, 4vw, 40px);
      font-size: clamp(15px, 2.3vw, 23px);
      font-weight: 650;
      line-height: 1.25;
    }
    .lyrics p { margin: 8px 0; }
    .lyrics .current { color: #fff; }
    @media (max-width: 600px) {
      body { padding: 0; }
      .frame {
        width: 100vw;
        height: 100dvh;
        aspect-ratio: auto;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 10px;
        padding: 12px;
        border-radius: 0;
      }
      .cover { width: min(48vw, 180px); flex: none; align-self: center; }
      .content { flex: none; }
      .eyebrow { margin-bottom: 4px; }
      h1 { font-size: 24px; }
      .artist { margin-top: 4px; font-size: 14px; }
      .progress { margin-top: 12px; }
      .lyrics { margin-top: 10px; font-size: 20px; }
      .lyrics p { margin: 4px 0; }
      .lyrics .next { font-size: 15px; }
    }
    @media (max-width: 600px) and (orientation: landscape) {
      .frame {
        display: grid;
        grid-template-columns: minmax(0, 35fr) minmax(0, 65fr);
        align-items: center;
      }
      .cover { width: 100%; }
    }
    .lyrics .next { color: #858585; }
  </style>
</head>
<body>
  <main class="frame" aria-label="Now playing display">
    <div id="cover" class="cover" role="img" aria-label="Album artwork"></div>
    <section class="content">
      <p id="status" class="eyebrow">Connecting</p>
      <h1 id="title">Spotify Smart Frame</h1>
      <p id="artist" class="artist">Waiting for playback…</p>
      <div id="progress" class="progress" role="progressbar" aria-label="Song progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="progress-fill"></span></div>
      <div class="times"><span id="elapsed">0:00</span><span id="duration">0:00</span></div>
      <div class="lyrics" aria-label="Current lyric" aria-live="polite">
        <p id="lyric" class="current">Lyrics will appear here</p>
        <p id="lyric-next" class="next"></p>
      </div>
    </section>
  </main>
  <script>
    const elements = Object.fromEntries(
      ["cover", "status", "title", "artist", "progress", "progress-fill", "elapsed", "duration", "lyric", "lyric-next"]
        .map(id => [id, document.getElementById(id)])
    );

    const formatTime = milliseconds => {
      const seconds = Math.max(0, Math.floor(milliseconds / 1000));
      return `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, "0")}`;
    };
    const setText = (element, text) => {
      if (element.textContent !== text) element.textContent = text;
    };

    function render(state) {
      if (!state.playing) {
        setText(elements.status, "Idle");
        setText(elements.title, "Nothing playing");
        setText(elements.artist, "Start Spotify to wake the display");
        setText(elements.lyric, "♪");
        setText(elements["lyric-next"], "");
        elements.cover.style.backgroundImage = "";
        elements.cover.setAttribute("aria-label", "Album artwork");
        elements["progress-fill"].style.width = "0%";
        elements.progress.setAttribute("aria-valuenow", "0");
        setText(elements.elapsed, "0:00");
        setText(elements.duration, "0:00");
        return;
      }

      const percent = state.duration_ms
        ? Math.min(100, state.progress_ms / state.duration_ms * 100)
        : 0;
      setText(elements.status, state.is_playing ? "Now playing" : "Paused");
      setText(elements.title, state.title);
      setText(elements.artist, state.artist);
      setText(elements.lyric, state.lyric || "♪");
      setText(elements["lyric-next"], state.lyric_next || "");
      elements.cover.style.backgroundImage = state.artwork ? `url("${state.artwork}")` : "";
      elements.cover.setAttribute("aria-label", `${state.title} album artwork`);
      elements["progress-fill"].style.width = `${percent}%`;
      elements.progress.setAttribute("aria-valuenow", String(Math.round(percent)));
      setText(elements.elapsed, formatTime(state.progress_ms));
      setText(elements.duration, formatTime(state.duration_ms));
    }

    async function refresh() {
      try {
        const response = await fetch("/api/state", { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        render(await response.json());
      } catch {
        elements.status.textContent = "Disconnected";
      }
    }

    refresh();
    setInterval(refresh, 250);
  </script>
</body>
</html>
